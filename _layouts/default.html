<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  {% if page.math %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams', processEscapes: true
      },
      options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}
    };
  </script>
  <script id="mathjax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-svg.js" onerror="document.documentElement.classList.add('math-unavailable')"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="identity" href="{{ '/' | relative_url }}" aria-label="ruihaox 首页">
        <span class="monogram" aria-hidden="true">rx<span></span></span>
        <span class="identity-copy"><strong>{{ site.title | escape }}</strong><span>日常 · 阅读 · 科研</span></span>
      </a>
      <div class="sidebar-rule"></div>
      <nav class="nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.section == 'home' %}aria-current="page"{% endif %}><span>首页</span><span class="nav-en" lang="en">HOME</span></a>
        <a href="{{ '/diary/' | relative_url }}" {% if page.section == 'diary' or page.categories contains 'diary' %}aria-current="page"{% endif %}><span>日记</span><span class="nav-en" lang="en">DAYS</span></a>
        <a href="{{ '/research/' | relative_url }}" {% if page.section == 'research' or page.categories contains 'research' %}aria-current="page"{% endif %}><span>科研笔记</span><span class="nav-en" lang="en">NOTES</span></a>
        <a href="{{ '/about/' | relative_url }}" {% if page.section == 'about' %}aria-current="page"{% endif %}><span>关于我</span><span class="nav-en" lang="en">ABOUT</span></a>
      </nav>
      <div class="sidebar-bottom"><span class="tiny-sprout" aria-hidden="true">✳</span><p>慢慢写，慢慢想。</p><a href="https://github.com/ruihaox" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
    </aside>
    <div class="main-column">
      <main id="main" tabindex="-1">{{ content }}</main>
      <footer class="footer"><span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span><span>一些生活，一些思考。</span></footer>
    </div>
  </div>
</body>
</html>
