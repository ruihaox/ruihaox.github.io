<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ profile.name | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=4">
<link rel="stylesheet" href="{{ '/academic.css' | relative_url }}?v=4">
<script src="{{ '/appearance.js' | relative_url }}?v=4"></script>
{% if page.math %}
<script>
window.MathJax = {
  tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], tags: 'ams', processEscapes: true},
  options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-svg.js" onerror="document.documentElement.classList.add('math-unavailable')"></script>
{% endif %}
